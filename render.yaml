services:
  - type: web
    name: academic-struggle-support-essu-guiuan
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: RENDER
        value: true

      # --- Admin Registration Code ---
      # Proteksyon para sa admin registration. Ilagay ang aktwal na code sa Render dashboard.
      - key: ADMIN_REGISTRATION_CODE
        sync: false

      # --- AI Services ---
      # Primary AI (libre): Groq. Ilagay ang aktwal na key sa Render dashboard.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      # Fallback AI services (opsyonal).
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MENTALHEALTHWEB_OPENAI_MODEL
        value: gpt-4o-mini

      # --- Database ---
      # Auto-filled kapag gumawa ka ng Render PostgreSQL database.
      - key: DATABASE_URL
        sync: false
      - key: MENTALHEALTHWEB_DB
        value: database.db

      # --- Email (SMTP) ---
      - key: EMAIL_BACKEND
        value: smtp
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_TIMEOUT
        value: "15"
      # Resend HTTP API key. Render blocks outbound SMTP, so use Resend to
      # actually deliver emails from production.
      - key: RESEND_API_KEY
        sync: false
      # SendGrid API key (free tier, no domain needed). Set this + EMAIL_SENDER
      # (your verified single sender) to deliver email without a domain.
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_DISPLAY_NAME
        value: Academic Struggle Chatbot
      - key: EMAIL_LOGO_URL
        value: ""
      - key: CRISIS_EMAIL_RECEIVER
        sync: false