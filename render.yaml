services:
  - type: web
    name: academic-struggle-support-essu-guiuan
    env: python
    region: oregon
    plan: free
    # Auto-deploy agad sa Render kada push sa main — hindi na kailangan ng Manual Deploy.
    autoDeploy: true
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: RENDER
        value: true

      # --- Admin Registration Code ---
      # Proteksyon para sa admin registration. Ilagay ang aktwal na code sa Render dashboard.
      - key: ADMIN_REGISTRATION_CODE
        sync: false

      # --- AI Services ---
      # Primary AI (libre): Groq. Ilagay ang aktwal na key sa Render dashboard.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      # Fallback AI services (opsyonal).
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MENTALHEALTHWEB_OPENAI_MODEL
        value: gpt-4o-mini

      # --- Database ---
      # Auto-filled kapag gumawa ka ng Render PostgreSQL database.
      - key: DATABASE_URL
        sync: false
      - key: MENTALHEALTHWEB_DB
        value: database.db

      # --- Email ---
      # IMPORTANT: Naka-block ang SMTP (ports 25/465/587) sa Render free tier
      # kaya HINDI gagana ang Gmail SMTP doon. Huwag nang gamiting default.
      # Para gumana ang Forgot Password + Register email sa Render:
      #   1. Gumawa ng FREE SendGrid account (100 emails/day, walang domain needed)
      #   2. Verify Single Sender (yung Gmail mo) sa SendGrid dashboard
      #   3. Gumawa ng API Key → ilagay bilang SENDGRID_API_KEY sa Render dashboard
      #   4. Ilagay din ang EMAIL_SENDER (yung verified Gmail) → Manual Deploy
      - key: EMAIL_BACKEND
        value: console
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_TIMEOUT
        value: "15"
      # Resend HTTP API key (alternative sa SendGrid). Render blocks outbound SMTP, so use Resend to
      # actually deliver emails from production.
      - key: RESEND_API_KEY
        sync: false
      # SendGrid API key (free tier, no domain needed). Set this + EMAIL_SENDER
      # (your verified single sender) to deliver email without a domain.
      - key: SENDGRID_API_KEY
        sync: false
      # --- GMAIL API (OAuth2) — INIREREKOMENDA ---
      # PINAKAMAGANDANG OPSYON: tunay na Gmail ang nagpapadala, kaya HINDI
      # napupunta sa spam, at HTTPS (port 443) kaya HINDI blocked sa Render.
      # Kunin ang mga value sa pamamagitan ng:  python get_gmail_token.py
      # Kung naka-set ang GMAIL_REFRESH_TOKEN, awtomatikong ito ang gagamitin
      # (mas priority kaysa SendGrid/Resend/SMTP).
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        sync: false
      - key: EMAIL_DISPLAY_NAME
        value: Academic Struggle Chatbot
      - key: EMAIL_LOGO_URL
        value: ""
      - key: CRISIS_EMAIL_RECEIVER
        sync: false