<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Something Went Wrong</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Poppins', sans-serif;
        }
        .auth-box {
            width: 90%;
            max-width: 460px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,255,255,0.2);
            text-align: center;
            color: white;
        }
        .auth-box h2 { margin-bottom: 12px; font-weight: 600; }
        .info-text { font-size: 14px; color: #ccc; margin-bottom: 20px; line-height: 1.6; }
        .auth-box a {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 24px;
            background: #00c6ff;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .auth-box a:hover { background: #0072ff; }
    </style>
</head>
<body>

<div class="auth-box">
    <h2>Something Went Wrong</h2>
    <p class="info-text">{{ message|default('An unexpected error occurred. Please try again later.') }}</p>
    <a href="{{ url_for('login') }}">Back to Login</a>
</div>

</body>
</html>
