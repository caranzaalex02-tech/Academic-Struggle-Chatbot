<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Poppins', sans-serif;
        }
        .auth-box {
            width: 90%;
            max-width: 400px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,255,255,0.2);
            text-align: center;
            color: white;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: #ccc;
            margin-bottom: 5px;
            display: block;
        }
        .auth-box h2 { margin-bottom: 20px; font-weight: 600; }
        .auth-box input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            transition: background-color 0.3s;
        }
        .auth-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .auth-box input:focus {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #5cb85c; /* Green for registration */
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        .auth-box button:hover { background: #4cae4c; }
        .error { color: #ff6b6b; margin-bottom: 10px; font-size: 14px; }
        .switch { margin-top: 15px; font-size: 14px; }
        .switch a { color: #00c6ff; text-decoration: none; font-weight: 500; }

        /* Styles for the password toggle icon */
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 50px; /* Make space for the icon */
        }
        .toggle-password {
            position: absolute;
            top: 64%; /* Adjust vertical position */
            right: 14px;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.95);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            user-select: none;
        }
        .toggle-password:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.28);
            color: #00c6ff;
            transform: translateY(-50%) scale(1.05);
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        .auth-box button[type="submit"] { background: linear-gradient(135deg, #f87171, #ef4444); box-shadow: 0 12px 28px -10px rgba(239, 68, 68, 0.5); }
        .auth-box button[type="submit"]:hover { box-shadow: 0 16px 34px -10px rgba(239, 68, 68, 0.6); }
    </style>
</head>
<body>

<div class="auth-box">
    <h2>Create First Admin Account</h2>
    <p style="font-size: 12px; color: #ddd; margin-bottom: 20px;">This page is for first-time setup only and will be disabled once an admin exists.</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" autocomplete="off">
        <div class="form-group">
            <label for="email">Admin Email</label>
            <input type="email" name="email" id="email" placeholder="Enter your admin email" required>
        </div>
        <div class="form-group password-wrapper">
            <label for="password">Password (min. 8 characters)</label>
            <input type="password" name="password" id="password" placeholder="Create a strong password" required>
            <span class="toggle-password" data-target="password">
                <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c2.76 0 5 2.24 5 5c0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75C21.27 7.61 17 4.5 12 4.5c-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7M2.28 4.49L.86 5.91 2 7.05C1.29 7.95.72 9 1 10.24c.73 3.38 3.97 6.03 7 6.71v-1.7c-1.73-.43-3.23-1.55-4.26-3.01.3-.5.66-1 1.06-1.47l1.42 1.42c-.15.43-.28.88-.36 1.34h1.5c.08-.44.21-.86.39-1.26l2.11 2.11c-.4.1-.81.15-1.23.15-2.76 0-5-2.24-5-5c0-.59.11-1.16.31-1.69L2.28 4.49M12 17c.95 0 1.82-.27 2.57-.72l1.43 1.43C15.9 18.44 14.62 19 13.19 19v1.7c3.03-.68 6.27-3.33 7-6.71.28-1.24-.29-2.29-1-3.19L17.73 8.57 12 14.3 2.28 4.49Z"/></svg>
                <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5m0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5Z"/></svg>
            </span>
        </div>
        <div class="form-group password-wrapper">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm your password" required>
            <span class="toggle-password" data-target="confirm_password">
                <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c2.76 0 5 2.24 5 5c0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75C21.27 7.61 17 4.5 12 4.5c-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7M2.28 4.49L.86 5.91 2 7.05C1.29 7.95.72 9 1 10.24c.73 3.38 3.97 6.03 7 6.71v-1.7c-1.73-.43-3.23-1.55-4.26-3.01.3-.5.66-1 1.06-1.47l1.42 1.42c-.15.43-.28.88-.36 1.34h1.5c.08-.44.21-.86.39-1.26l2.11 2.11c-.4.1-.81.15-1.23.15-2.76 0-5-2.24-5-5c0-.59.11-1.16.31-1.69L2.28 4.49M12 17c.95 0 1.82-.27 2.57-.72l1.43 1.43C15.9 18.44 14.62 19 13.19 19v1.7c3.03-.68 6.27-3.33 7-6.71.28-1.24-.29-2.29-1-3.19L17.73 8.57 12 14.3 2.28 4.49Z"/></svg>
                <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5m0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5Z"/></svg>
            </span>
        </div>
        <button type="submit">Create Admin Account</button>
    </form>

    <p class="switch">
        Already have an admin account? <a href="{{ url_for('admin_login') }}">Log In</a>
    </p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggleButtons = document.querySelectorAll('.toggle-password');

        toggleButtons.forEach(button => {
            button.addEventListener('click', function () {
                const targetInputId = this.getAttribute('data-target');
                const passwordInput = document.getElementById(targetInputId);
                const eyeOpen = this.querySelector('.eye-open');
                const eyeClosed = this.querySelector('.eye-closed');

                if (passwordInput && eyeOpen && eyeClosed) {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    eyeClosed.style.display = isPassword ? 'none' : 'inline';
                    eyeOpen.style.display = isPassword ? 'inline' : 'none';
                }
            });
        });
    });
</script>

</body>
</html>
