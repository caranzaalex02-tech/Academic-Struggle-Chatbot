<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            perspective: 1200px;
            font-family: 'Poppins', sans-serif;
        }
        .auth-box {
            width: 90%;
            max-width: 420px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,255,255,0.2);
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
            animation: rotateIn 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .auth-box h2, .auth-box .flash-message, .auth-box form {
            opacity: 0;
            animation: fadeInUp 0.5s ease-out 0.4s forwards;
        }
        .auth-box h2 { margin-bottom: 20px; font-weight: 600; }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            transition: background-color 0.3s;
        }
        .auth-box input::placeholder { color: rgba(255, 255, 255, 0.6); }
        .auth-box input:focus { background-color: rgba(255, 255, 255, 0.2); }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #00c6ff;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        .auth-box button:hover { background: #0072ff; }
        .flash-message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        .flash-success { background-color: rgba(46, 213, 115, 0.2); color: #2ed573; }
        .flash-error { background-color: rgba(255, 107, 107, 0.2); color: #ff6b6b; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes rotateIn {
            from { transform: rotateY(-90deg) scale(0.9); opacity: 0; }
            to { transform: rotateY(0deg) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="auth-box">
    <h2>Reset Your Password</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" autocomplete="off">
        <input type="password" name="password" placeholder="Enter new password" required>
        <input type="password" name="confirm_password" placeholder="Confirm new password" required>
        <button type="submit">Reset Password</button>
    </form>
</div>

</body>
</html>
