<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <!-- Parehong design at green/yellow fluid waves background ng landing + login + register page -->
    <style>
        body {
            font-family: 'Poppins', 'Inter', sans-serif;
            height: auto;
            min-height: 100vh;
            background: #dcfce7 url('{{ url_for('static', filename='images/fluid_waves_bg.svg') }}') center/cover fixed no-repeat;
        }

        body::before {
            background: linear-gradient(160deg, rgba(220, 252, 231, 0.28), rgba(187, 247, 208, 0.20));
        }

        body::after {
            background: none;
        }

        /* Card na kapareho ng login/register card sa landing page */
        .auth-box {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(134, 239, 172, 0.5);
            border-radius: 22px;
            color: var(--text-primary);
            box-shadow: 0 24px 60px -24px rgba(20, 83, 45, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .auth-box .logo-wrap,
        .auth-box > img {
            background: #fff;
            border: none;
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.4), 0 10px 26px rgba(20, 83, 45, 0.18);
        }

        .auth-box h2 {
            color: var(--text-primary);
        }

        .auth-box input,
        .auth-box select,
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px 15px;
            margin: 0;
            border-radius: 12px;
            border: 1.5px solid rgba(134, 239, 172, 0.55);
            outline: none;
            font-size: 0.94rem;
            font-family: inherit;
            background: #fff;
            color: var(--text-primary);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-box input::placeholder { color: var(--text-muted); }

        .auth-box input:focus {
            background: #fff;
            border-color: var(--btn-green);
            box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.25);
        }

        .password-wrapper input { padding-right: 50px; }

        .auth-box button[type="submit"] {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #fff;
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 10px 24px -10px rgba(34, 197, 94, 0.55);
            transition: filter 0.2s ease, transform 0.2s ease;
        }

        .auth-box button[type="submit"]:hover {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            filter: brightness(1.05);
            transform: translateY(-2px);
        }

        /* Mobile: scroll ang background gaya ng landing page */
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
                background-size: cover;
                -webkit-text-size-adjust: 100%;
            }
        }
    </style>
</head>
<body>

<div class="auth-box">
    <h2>Reset Your Password</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" autocomplete="off">
        <div class="password-wrapper">
            <input type="password" name="password" id="password" placeholder="Enter new password" required>
            <span class="toggle-password" onclick="togglePassword('password', 'eye-closed-1', 'eye-open-1')" aria-label="Toggle password visibility">
                <svg id="eye-closed-1" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c2.76 0 5 2.24 5 5c0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75C21.27 7.61 17 4.5 12 4.5c-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7M2.28 4.49L.86 5.91 2 7.05C1.29 7.95.72 9 1 10.24c.73 3.38 3.97 6.03 7 6.71v-1.7c-1.73-.43-3.23-1.55-4.26-3.01.3-.5.66-1 1.06-1.47l1.42 1.42c-.15.43-.28.88-.36 1.34h1.5c.08-.44.21-.86.39-1.26l2.11 2.11c-.4.1-.81.15-1.23.15-2.76 0-5-2.24-5-5c0-.59.11-1.16.31-1.69L2.28 4.49M12 17c.95 0 1.82-.27 2.57-.72l1.43 1.43C15.9 18.44 14.62 19 13.19 19v1.7c3.03-.68 6.27-3.33 7-6.71.28-1.24-.29-2.29-1-3.19L17.73 8.57 12 14.3 2.28 4.49Z"/></svg>
                <svg id="eye-open-1" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5m0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5Z"/></svg>
            </span>
        </div>
        <div class="password-wrapper">
            <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm new password" required>
            <span class="toggle-password" onclick="togglePassword('confirm_password', 'eye-closed-2', 'eye-open-2')" aria-label="Toggle password visibility">
                <svg id="eye-closed-2" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c2.76 0 5 2.24 5 5c0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75C21.27 7.61 17 4.5 12 4.5c-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7M2.28 4.49L.86 5.91 2 7.05C1.29 7.95.72 9 1 10.24c.73 3.38 3.97 6.03 7 6.71v-1.7c-1.73-.43-3.23-1.55-4.26-3.01.3-.5.66-1 1.06-1.47l1.42 1.42c-.15.43-.28.88-.36 1.34h1.5c.08-.44.21-.86.39-1.26l2.11 2.11c-.4.1-.81.15-1.23.15-2.76 0-5-2.24-5-5c0-.59.11-1.16.31-1.69L2.28 4.49M12 17c.95 0 1.82-.27 2.57-.72l1.43 1.43C15.9 18.44 14.62 19 13.19 19v1.7c3.03-.68 6.27-3.33 7-6.71.28-1.24-.29-2.29-1-3.19L17.73 8.57 12 14.3 2.28 4.49Z"/></svg>
                <svg id="eye-open-2" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5m0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5Z"/></svg>
            </span>
        </div>
        <button type="submit">Reset Password</button>
    </form>
</div>

<script>
    function togglePassword(inputId, closedId, openId) {
        const input = document.getElementById(inputId);
        const eyeClosed = document.getElementById(closedId);
        const eyeOpen = document.getElementById(openId);
        if (!input || !eyeClosed || !eyeOpen) return;
        if (input.type === 'password') {
            input.type = 'text';
            eyeClosed.style.display = 'none';
            eyeOpen.style.display = 'inline';
        } else {
            input.type = 'password';
            eyeOpen.style.display = 'none';
            eyeClosed.style.display = 'inline';
        }
    }
</script>

</body>
</html>
