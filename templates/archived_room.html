<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chat History</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    overflow-x:hidden;
    overflow-y:auto;
    min-height:100vh;
    /* Parehong background ng chatbot — light green fluid waves */
    background:#dcfce7 url('{{ url_for('static', filename='images/fluid_waves_bg.svg') }}') center/cover fixed no-repeat;
    color:#14532d;
}

/* Overlay */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(160deg,rgba(220,252,231,.30),rgba(187,247,208,.22));
    z-index:-1;
}

/* Main Container */
.container{
    width:90%;
    max-width:1000px;
    height:85vh;
    margin:40px auto;
    background:rgba(255,255,255,0.55); /* light glass — kapareho ng chatbot feel */
    padding:20px;
    border-radius:20px;
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(134,239,172,0.55);
    box-shadow:0 8px 40px rgba(20,83,45,0.12),0 2px 8px rgba(20,83,45,0.06),inset 0 1px 0 rgba(255,255,255,0.5);
    overflow-y:auto;
    position:relative;
}

/* Back button & Search bar container */
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.back{
    padding:8px 15px;
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(134,239,172,0.55);
    border-radius:12px;
    text-decoration:none;
    color:#14532d;
    font-weight:600;
    transition:0.3s;
}
.back:hover{
    background:rgba(34,197,94,0.15);
    border-color:rgba(34,197,94,0.5);
}

/* Search bar */
#search-input{
    padding:10px 15px;
    border-radius:12px;
    border:1px solid rgba(134,239,172,0.55);
    outline:none;
    width:250px;
    background:rgba(255,255,255,0.55);
    color:#14532d;
    font-size: 14px;
}
#search-input::placeholder{
    color:rgba(20,83,45,0.5);
}
#search-input:focus{
    border-color:#22c55e;
    box-shadow:0 0 0 4px rgba(34,197,94,0.12);
}

/* Table Design */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th, td{
    padding:12px;
    text-align:left;
}

th{
    background:rgba(34,197,94,0.12);
    color:#14532d;
    font-weight:700;
}

tr{
    background:rgba(255,255,255,0.35);
    border-bottom:1px solid rgba(134,239,172,0.35);
    color:#14532d;
}

tr:hover{
    background:rgba(255,255,255,0.6);
}

/* Action buttons */
a.action-btn{
    color:#fff;
    text-decoration:none;
    padding:6px 12px;
    border-radius:8px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    font-size:13px;
    font-weight:600;
    transition:0.3s;
    box-shadow:0 4px 12px rgba(34,197,94,0.3);
}
a.action-btn:hover{
    background:#16a34a;
    color:#fff;
}

/* Style for the delete button to separate it */
a.action-btn.delete-btn {
    background: rgba(255, 99, 71, 0.4); /* Distinct color for delete */
}
a.action-btn.delete-btn:hover {
    background: #ff4757; /* Brighter red on hover */
    color: white;
}

/* Style for highlighted search text */
mark {
    background-color: #facc15;
    color: #14532d;
    border-radius: 3px;
    padding:0 2px;
}

/* Responsive */
@media(max-width:600px){
    .container{
        height:90vh;
        padding:15px;
    }
    th, td{
        font-size:12px;
    }
    #search-input{
        width:100%;
        margin-top:8px;
    }
}
</style>
</head>
<body>

<div class="overlay"></div>

<div class="container">

<div class="top-bar">
    <a href="/chatbot" class="back">⬅ Back to Chat</a>
    <input type="text" id="search-input" placeholder="Search conversation..." onkeyup="filterTable()">
</div>

<h2> Archived Conversations</h2>

<table id="archived-table">
<thead>
<tr>
<th>Time</th>
<th>User Message</th>
<th>Bot Response</th>
<th>Restore</th>
<th>Delete</th>
</tr>
</thead>
<tbody>
{% for chat in archived %}
<tr>
<td>{{ chat.timestamp }}</td>
<td>{{ chat.user_message }}</td>
<td>{{ chat.bot_response }}</td>
<td><a href="/restore_chat/{{ chat.id }}" class="action-btn">Restore</a></td>
<td><a href="/delete_chat/{{ chat.id }}" class="action-btn delete-btn" onclick="return confirm('Are you sure you want to permanently delete this conversation?');">Delete</a></td>
</tr>
{% endfor %}
</tbody>
</table>

</div>

<script>
function filterTable(){
    let input=document.getElementById("search-input").value.toLowerCase();
    let table=document.getElementById("archived-table");
    let trs=table.getElementsByTagName("tr");
    for(let i=1;i<trs.length;i++){ // skip header
        let tds=trs[i].getElementsByTagName("td");
        let userText=tds[1].textContent.toLowerCase();
        let botText=tds[2].textContent.toLowerCase();
        if(userText.includes(input) || botText.includes(input)){
            trs[i].style.display="";
        }else{
            trs[i].style.display="none";
        }
    }
}
</script>

</body>
</html>
