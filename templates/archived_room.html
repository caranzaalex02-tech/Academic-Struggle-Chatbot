<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Archived Conversations</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    overflow-x:hidden;
    overflow-y:auto;
    min-height:100vh;
    background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2560&q=80') no-repeat center center fixed;
    background-size: cover;
    color:white;
}

/* Overlay */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.35);
    z-index:-1;
}

/* Main Container */
.container{
    width:90%;
    max-width:1000px;
    height:85vh;
    margin:40px auto;
    background:rgba(255,255,255,0.1); /* transparent glass */
    padding:20px;
    border-radius:20px;
    backdrop-filter:blur(15px);
    box-shadow:0 0 30px rgba(0,255,255,0.3);
    overflow-y:auto;
    position:relative;
}

/* Back button & Search bar container */
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.back{
    padding:8px 15px;
    background:rgba(255,255,255,0.2);
    border-radius:12px;
    text-decoration:none;
    color:white;
    transition:0.3s;
}
.back:hover{
    background:rgba(0,255,255,0.3);
}

/* Search bar */
#search-input{
    padding:10px 15px;
    border-radius:12px;
    border:none;
    outline:none;
    width:250px;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size: 14px;
}
#search-input::placeholder{
    color:rgba(255,255,255,0.7);
}

/* Table Design */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th, td{
    padding:12px;
    text-align:left;
}

th{
    background:rgba(255,255,255,0.15);
    font-weight:normal;
}

tr{
    background:rgba(255,255,255,0.05);
    border-bottom:1px solid rgba(255,255,255,0.1);
}

tr:hover{
    background:rgba(255,255,255,0.1);
}

/* Action buttons */
a.action-btn{
    color:white;
    text-decoration:none;
    padding:6px 12px;
    border-radius:8px;
    background:rgba(0,255,255,0.3);
    font-size:13px;
    transition:0.3s;
}
a.action-btn:hover{
    background:#00ffff;
    color:black;
}

/* Style for the delete button to separate it */
a.action-btn.delete-btn {
    background: rgba(255, 99, 71, 0.4); /* Distinct color for delete */
}
a.action-btn.delete-btn:hover {
    background: #ff4757; /* Brighter red on hover */
    color: white;
}

/* Style for highlighted search text */
mark {
    background-color: #00ffff;
    color: black;
    border-radius: 3px;
}

/* Responsive */
@media(max-width:600px){
    .container{
        height:90vh;
        padding:15px;
    }
    th, td{
        font-size:12px;
    }
    #search-input{
        width:100%;
        margin-top:8px;
    }
}
</style>
</head>
<body>

<div class="overlay"></div>

<div class="container">

<div class="top-bar">
    <a href="/chatbot" class="back">⬅ Back to Chat</a>
    <input type="text" id="search-input" placeholder="Search conversation..." onkeyup="filterTable()">
</div>

<h2> Archived Conversations</h2>

<table id="archived-table">
<thead>
<tr>
<th>Time</th>
<th>User Message</th>
<th>Bot Response</th>
<th>Restore</th>
<th>Delete</th>
</tr>
</thead>
<tbody>
{% for chat in archived %}
<tr>
<td>{{ chat.timestamp }}</td>
<td>{{ chat.user_message }}</td>
<td>{{ chat.bot_response }}</td>
<td><a href="/restore_chat/{{ chat.id }}" class="action-btn">Restore</a></td>
<td><a href="/delete_chat/{{ chat.id }}" class="action-btn delete-btn" onclick="return confirm('Are you sure you want to permanently delete this conversation?');">Delete</a></td>
</tr>
{% endfor %}
</tbody>
</table>

</div>

<script>
function filterTable(){
    let input=document.getElementById("search-input").value.toLowerCase();
    let table=document.getElementById("archived-table");
    let trs=table.getElementsByTagName("tr");
    for(let i=1;i<trs.length;i++){ // skip header
        let tds=trs[i].getElementsByTagName("td");
        let userText=tds[1].textContent.toLowerCase();
        let botText=tds[2].textContent.toLowerCase();
        if(userText.includes(input) || botText.includes(input)){
            trs[i].style.display="";
        }else{
            trs[i].style.display="none";
        }
    }
}
</script>

</body>
</html>
