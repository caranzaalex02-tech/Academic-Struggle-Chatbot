<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chat with {{ partner }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* CSS Variables for Themes */
:root {
    --bg-color: rgba(255,255,255,0.1);
    --header-bg: rgba(255,255,255,0.25);
    --text-color: #1a4a5a;
    --sent-bg: #0ea5b9;
    --sent-text: #ffffff;
    --received-bg: rgba(255,255,255,0.7);
    --received-text: #1a4a5a;
    --input-area-bg: rgba(255,255,255,0.2);
    --input-bg: rgba(255,255,255,0.5);
    --input-text: #1a4a5a;
    --border-color: rgba(255,255,255,0.35);
    --shadow: 0 2px 8px rgba(0,40,60,0.06);
    --back-btn-color: #0e6b7a;
    --backdrop: blur(18px);
}

[data-theme="dark"] {
    --bg-color: rgba(15,23,42,0.3);
    --header-bg: rgba(15,23,42,0.5);
    --text-color: #e2e8f0;
    --sent-bg: #0ea5b9;
    --sent-text: #fff;
    --received-bg: rgba(30,41,59,0.7);
    --received-text: #e2e8f0;
    --input-area-bg: rgba(15,23,42,0.4);
    --input-bg: rgba(30,41,59,0.6);
    --input-text: #e2e8f0;
    --border-color: rgba(255,255,255,0.12);
    --shadow: 0 2px 8px rgba(0,0,0,0.3);
    --back-btn-color: #0ea5b9;
    --backdrop: blur(18px);
}
[data-theme="ocean"] {
    --bg-color: rgba(224,247,250,0.25);
    --header-bg: rgba(178,235,242,0.4);
    --text-color: #006064;
    --sent-bg: #00bcd4;
    --sent-text: #fff;
    --received-bg: rgba(255,255,255,0.7);
    --received-text: #006064;
    --input-area-bg: rgba(178,235,242,0.35);
    --input-bg: rgba(255,255,255,0.6);
    --input-text: #006064;
    --border-color: rgba(128,222,234,0.5);
    --shadow: 0 2px 8px rgba(0,96,100,0.08);
    --back-btn-color: #0097a7;
    --backdrop: blur(18px);
}
[data-theme="sunset"] {
    --bg-color: rgba(255,243,224,0.25);
    --header-bg: rgba(255,224,178,0.4);
    --text-color: #783400;
    --sent-bg: #f97316;
    --sent-text: #fff;
    --received-bg: rgba(255,255,255,0.7);
    --received-text: #783400;
    --input-area-bg: rgba(255,224,178,0.35);
    --input-bg: rgba(255,255,255,0.6);
    --input-text: #783400;
    --border-color: rgba(255,204,128,0.5);
    --shadow: 0 2px 8px rgba(120,52,0,0.08);
    --back-btn-color: #f57c00;
    --backdrop: blur(18px);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body {
    background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2560&q=80') no-repeat center center fixed;
    background-size: cover;
    color: var(--text-color);
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
}
body::after {
    content: ""; position: fixed; inset: 0;
    background: rgba(0,40,60,0.3); z-index: -1; pointer-events: none;
}
.header {
    padding: 10px 15px;
    background: var(--header-bg);
    backdrop-filter: var(--backdrop);
    -webkit-backdrop-filter: var(--backdrop);
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border-color);
    box-shadow: var(--shadow); z-index: 10; flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.back-btn { text-decoration: none; color: var(--back-btn-color); font-size: 22px; font-weight: bold; line-height: 1; }
.partner-avatar {
    width: 36px; height: 36px; min-width: 36px; min-height: 36px;
    border-radius: 12px; object-fit: cover; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.5);
}
.partner-name { font-size: 16px; font-weight: 600; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.theme-selector { position: relative; }
.theme-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 5px; border-radius: 50%; transition: 0.2s; }
.theme-btn:hover { background: rgba(0,0,0,0.08); }
.theme-options {
    display: none; position: absolute; right: 0; top: 38px;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
    border: 1px solid var(--border-color); border-radius: 10px;
    padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    width: 130px; z-index: 20;
}
.theme-option {
    display: block; width: 100%; padding: 8px 12px; text-align: left;
    background: none; border: none; color: #1a4a5a; cursor: pointer;
    border-radius: 6px; font-size: 13px; font-weight: 500;
}
.theme-option:hover { background: rgba(14,165,185,0.1); color: #0e6b7a; }

.chat-area {
    flex: 1; min-height: 0;
    overflow-y: auto; padding: 16px 12px;
    display: flex; flex-direction: column; gap: 6px;
    background: var(--bg-color);
    backdrop-filter: var(--backdrop);
    -webkit-backdrop-filter: var(--backdrop);
    -webkit-overflow-scrolling: touch;
}
.message {
    max-width: 75%; padding: 8px 12px; border-radius: 16px;
    font-size: 14px; line-height: 1.4; word-wrap: break-word;
    position: relative; overflow-wrap: anywhere;
}
.message img { max-width: 100%; border-radius: 12px; margin-top: 4px; cursor: pointer; }
.message.sent {
    align-self: flex-end; background: var(--sent-bg);
    color: var(--sent-text); border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(14,165,185,0.25);
}
.message.received {
    align-self: flex-start; background: var(--received-bg);
    color: var(--received-text); border-bottom-left-radius: 4px;
    backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.3);
}
.timestamp { font-size: 10px; opacity: 0.7; margin-top: 3px; display: block; text-align: right; }
.typing-indicator { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
.typing-indicator span { height: 7px; width: 7px; background-color: var(--text-color); opacity: 0.5; border-radius: 50%; animation: typing-bounce 1.2s infinite ease-in-out; }
.typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
.typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
@keyframes typing-bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }

.input-area {
    padding: 8px 12px 12px;
    background: var(--input-area-bg);
    backdrop-filter: var(--backdrop);
    -webkit-backdrop-filter: var(--backdrop);
    display: flex; gap: 6px; align-items: center; flex-shrink: 0;
    border-top: 1px solid var(--border-color);
}
input {
    flex: 1; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--border-color);
    background: var(--input-bg); color: var(--input-text);
    outline: none; font-size: 14px; min-width: 0;
}
input::placeholder { color: #7aacbc; }
input:focus { border-color: #0ea5b9; box-shadow: 0 0 0 3px rgba(14,165,185,0.15); }
button.attach-btn {
    padding: 8px; border-radius: 50%; border: none; background: none;
    color: var(--sent-bg); cursor: pointer; font-size: 18px; flex-shrink: 0;
}
button.send-btn {
    padding: 8px 14px; border-radius: 999px; border: none;
    background: linear-gradient(135deg,#0ea5b9,#0891b2);
    color: #fff; font-weight: 700; cursor: pointer; font-size: 13px;
    box-shadow: 0 4px 12px rgba(14,165,185,0.3);
    transition: transform 0.15s, box-shadow 0.15s; flex-shrink: 0;
}
button.send-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(14,165,185,0.4); }

/* Image Modal */
.image-modal { display: none; position: fixed; z-index: 1000; padding-top: 60px; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.9); }
.image-modal-content { margin: auto; display: block; width: 80%; max-width: 700px; animation-name: zoom; animation-duration: 0.6s; }
@keyframes zoom { from {transform:scale(0)} to {transform:scale(1)} }
.close-modal { position: absolute; top: 15px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; transition: 0.3s; }
.close-modal:hover,
.close-modal:focus { color: #bbb; text-decoration: none; cursor: pointer; }

/* ============================================== */
/* MOBILE RESPONSIVE (≤768px)                     */
/* ============================================== */
@media (max-width: 768px) {
    .header { padding: 8px 10px; }
    .back-btn { font-size: 20px; }
    .partner-avatar { width: 30px; height: 30px; min-width: 30px; min-height: 30px; border-radius: 10px; }
    .partner-name { font-size: 14px; }
    .chat-area { padding: 10px 8px; gap: 4px; }
    .message { max-width: 85%; font-size: 13px; padding: 8px 10px; border-radius: 14px; }
    .input-area { padding: 6px 8px 10px; gap: 4px; }
    input { padding: 9px 12px; font-size: 13px; }
    button.send-btn { padding: 8px 12px; font-size: 12px; }
    button.attach-btn { font-size: 16px; padding: 6px; }
    .image-modal-content { width: 95%; }
}
@media (max-width: 400px) {
    .header { padding: 6px 8px; }
    .partner-name { font-size: 13px; }
    .message { max-width: 92%; font-size: 12px; }
    input { font-size: 12px; }
    button.send-btn { padding: 6px 10px; font-size: 11px; }
}

</style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <a href="/community" class="back-btn">⬅</a>
        <img src="{{ partner_pic }}" alt="Partner Avatar" class="partner-avatar">
        <span class="partner-name">{{ partner }}</span>
    </div>
    <div class="theme-selector">
        <button class="theme-btn" onclick="toggleThemeMenu()">🎨</button>
        <div class="theme-options" id="theme-menu">
            <button class="theme-option" onclick="setTheme('light')">⚪ Light</button>
            <button class="theme-option" onclick="setTheme('dark')">⚫ Dark</button>
            <button class="theme-option" onclick="setTheme('ocean')">🌊 Ocean</button>
            <button class="theme-option" onclick="setTheme('sunset')">🌅 Sunset</button>
        </div>
    </div>
</div>

<div class="chat-area" id="chat-box">
    <!-- Messages will load here -->
</div>

<div class="input-area">
    <input type="text" id="msg-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <input type="file" id="image-input" accept="image/*" style="display: none;">
    <button class="attach-btn" onclick="document.getElementById('image-input').click()">📎</button>
    <button class="send-btn" onclick="sendMessage()">➤</button>
</div>

<!-- Image Modal -->
<div id="imageModal" class="image-modal">
  <span class="close-modal" onclick="closeImageModal()">&times;</span>
  <img class="image-modal-content" id="modalImage">
</div>

<script>
const partner = "{{ partner }}";
const currentUser = "{{ username }}";
const chatBox = document.getElementById('chat-box');
const imageInput = document.getElementById('image-input');
const msgInput = document.getElementById('msg-input');

// Theme Logic
function toggleThemeMenu() {
    const menu = document.getElementById('theme-menu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}

function setTheme(theme) {
    if (theme === 'light') {
        document.body.removeAttribute('data-theme');
    } else {
        document.body.setAttribute('data-theme', theme);
    }
    localStorage.setItem('chat-theme', theme);
    document.getElementById('theme-menu').style.display = 'none';
}

// Load saved theme
const savedTheme = localStorage.getItem('chat-theme');
if (savedTheme) {
    setTheme(savedTheme);
}

// Close menu when clicking outside
document.addEventListener('click', function(event) {
    const selector = document.querySelector('.theme-selector');
    if (!selector.contains(event.target)) {
        document.getElementById('theme-menu').style.display = 'none';
    }
});

// Image Modal Logic
const modal = document.getElementById("imageModal");
const modalImg = document.getElementById("modalImage");
function openImageModal(src) {
  modal.style.display = "block";
  modalImg.src = src;
}
function closeImageModal() {
  modal.style.display = "none";
}


// Image Upload Logic
imageInput.addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append('file', file);

    // Optional: Show a temporary "uploading..." message
    const tempId = 'temp-upload-' + Date.now();
    const div = document.createElement('div');
    div.id = tempId;
    div.className = 'message sent';
    div.innerHTML = '<i>Uploading image...</i>';
    chatBox.appendChild(div);
    scrollToBottom();

    fetch('/api/upload_image', {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById(tempId)?.remove(); // Remove temporary message
        if (data.url) {
            const messageContent = `[IMG]${data.url}`;
            fetch('/api/send_peer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ receiver: partner, message: messageContent })
            }).then(() => {
                loadMessages(true); // Force reload to show the new image
            });
        } else {
            alert('Image upload failed: ' + (data.error || 'Unknown error'));
        }
    })
    .catch(err => {
        document.getElementById(tempId)?.remove();
        alert('An error occurred during upload.');
        console.error(err);
    });

    this.value = ''; // Reset file input
});

// Typing Indicator Logic
msgInput.addEventListener('input', () => {
    // Send "is typing" signal on every input
    fetch('/api/typing', { method: 'POST' });
});

function checkTypingStatus() {
    fetch(`/api/typing_status/${partner}`)
    .then(res => res.json())
    .then(data => {
        let indicator = document.getElementById('typing-indicator');
        
        if (data.is_typing) {
            if (!indicator) { // If it doesn't exist, create and append it
                indicator = document.createElement('div');
                indicator.id = 'typing-indicator';
                indicator.className = 'message received';
                indicator.style.width = 'fit-content';
                indicator.innerHTML = `
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                `;
                chatBox.appendChild(indicator);
                scrollToBottom();
            }
        } else {
            if (indicator) { // If it exists, remove it
                indicator.remove();
            }
        }
    });
}

function scrollToBottom() {
    chatBox.scrollTop = chatBox.scrollHeight;
}

function loadMessages(forceUpdate = false) {
    fetch(`/api/get_peer/${partner}`)
    .then(res => res.json())
    .then(data => {
        const currentMessageCount = chatBox.querySelectorAll('.message').length;
        if (forceUpdate || currentMessageCount !== data.messages.length) {
            chatBox.innerHTML = ''; // Clear the box
            data.messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.sender === currentUser ? 'sent' : 'received'}`;
                
                if (msg.message.startsWith('[IMG]')) {
                    const imageUrl = msg.message.substring(5); // Remove '[IMG]'
                    messageDiv.innerHTML = `<img src="${imageUrl}" alt="User image" onclick="openImageModal('${imageUrl}')"> <span class="timestamp">${msg.timestamp}</span>`;
                } else {
                    // CRITICAL SECURITY FIX: Use textContent to prevent Cross-Site Scripting (XSS).
                    // This ensures that any HTML/script tags sent by a user are displayed as plain text, not executed.
                    const messageTextNode = document.createTextNode(msg.message);
                    const timestampSpanNode = document.createElement('span');
                    timestampSpanNode.className = 'timestamp';
                    timestampSpanNode.textContent = msg.timestamp;
                    
                    messageDiv.appendChild(messageTextNode);
                    messageDiv.appendChild(document.createTextNode(' ')); // Add a space before the timestamp
                    messageDiv.appendChild(timestampSpanNode);
                }

                chatBox.appendChild(messageDiv);
            });
            scrollToBottom(); // Automatically scroll to the latest message
        }
    });
}

function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if(!text) return;

    fetch('/api/send_peer', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ receiver: partner, message: text })
    }).then(() => {
        input.value = '';
        loadMessages(true); // Force reload messages immediately for instant feedback
    });
}

// Poll for new messages every 2 seconds
setInterval(loadMessages, 2500);
setInterval(checkTypingStatus, 2000); // Check for typing status more frequently
loadMessages(); // Initial load
</script>

</body>
</html>
