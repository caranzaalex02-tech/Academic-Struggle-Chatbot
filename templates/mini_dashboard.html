<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mood Analytics</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<style>
video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #ffffff;
    z-index: 1;
}
</style>

</head>

<body>

<video autoplay muted loop>
<source src="{{ url_for('static', filename='videos/background.mp4') }}" type="video/mp4">
</video>

<div class="overlay">

<div class="row">
<div class="chart-wrapper">
<canvas id="pieChart"></canvas>
</div>

<div class="chart-wrapper">
<canvas id="lineChart"></canvas>
</div>
</div>

<div class="top-links">
<a href="{{ url_for('chatbot') }}" class="btn btn-outline btn-sm">⬅ Back</a>
<a href="{{ url_for('archived_room') }}" class="btn btn-outline btn-sm">📂 Archive</a>
<a href="{{ url_for('logout') }}" class="btn btn-outline btn-sm">🚪 Logout</a>
</div>

</div>

<!-- SAFE JSON DATA (NO RED IN JS) -->
<script id="chart-data" type="application/json">
{
  "moods": {{ moods | tojson }},
  "counts": {{ counts | tojson }},
  "days": {{ days | tojson }},
  "trend_data": {{ trend_data | tojson }}
}
</script>

<script>
const rawData = document.getElementById("chart-data").textContent;
const chartData = JSON.parse(rawData);

/* PIE CHART */
new Chart(document.getElementById("pieChart"), {
type: "pie",
data: {
labels: chartData.moods,
datasets: [{
data: chartData.counts,
backgroundColor: ["#4ade80","#facc15","#f87171"]
}]
},
options: {
responsive: true,
maintainAspectRatio: false,
plugins: {
legend: { position: "bottom" }
}
}
});

/* LINE CHART */
new Chart(document.getElementById("lineChart"), {
type: "line",
data: {
labels: chartData.days,
datasets: [
{
label: "Happy",
data: chartData.trend_data.Happy,
borderColor: "#4ade80",
tension: 0.3
},
{
label: "Neutral",
data: chartData.trend_data.Neutral,
borderColor: "#facc15",
tension: 0.3
},
{
label: "Sad",
data: chartData.trend_data.Sad,
borderColor: "#f87171",
tension: 0.3
}
]
},
options: {
responsive: true,
maintainAspectRatio: false,
plugins: {
legend: { position: "bottom" }
},
scales: {
y: { beginAtZero: true }
}
}
});
</script>

</body>
</html>
