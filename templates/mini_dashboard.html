<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mood Analytics</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<style>
/* Mini dashboard — clean, no video/3D */
.mini-dash-container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 32px 28px;
    background: #f0fdf4;
}

.chart-row {
    display: flex;
    gap: 28px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 32px;
}

.chart-wrapper {
    flex: 1;
    min-width: 280px;
    max-width: 420px;
}

.chart-wrapper canvas {
    width: 100% !important;
    height: auto !important;
    aspect-ratio: 16 / 10;
}

.top-links {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 24px;
}

.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 0.92rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: background 0.2s ease, transform 0.1s ease;
}

.btn-green {
    background: #4ade80;
    color: #fff;
    box-shadow: 0 4px 14px rgba(74,222,128,0.35);
}

.btn-green:hover {
    background: #22c55e;
    color: #fff;
    transform: translateY(-1px);
}

.btn-yellow {
    background: #facc15;
    color: #14532d;
    box-shadow: 0 4px 14px rgba(250,204,21,0.35);
}

.btn-yellow:hover {
    background: #eab308;
    color: #14532d;
    transform: translateY(-1px);
}

.btn-sm {
    padding: 7px 14px;
    font-size: 0.82rem;
}
</style>

</head>

<body>

<div class="mini-dash-container">

<div class="chart-row">
<div class="chart-wrapper">
<canvas id="pieChart"></canvas>
</div>

<div class="chart-wrapper">
<canvas id="lineChart"></canvas>
</div>
</div>

<div class="top-links">
<a href="{{ url_for('chatbot') }}" class="btn btn-green btn-sm">⬅ Back</a>
<a href="{{ url_for('archived_room') }}" class="btn btn-yellow btn-sm">📂 Archive</a>
<a href="{{ url_for('logout') }}" class="btn btn-yellow btn-sm">🚪 Logout</a>
</div>

</div>

<!-- SAFE JSON DATA (NO RED IN JS) -->
<script id="chart-data" type="application/json">
{
  "moods": {{ moods | tojson }},
  "counts": {{ counts | tojson }},
  "days": {{ days | tojson }},
  "trend_data": {{ trend_data | tojson }}
}
</script>

<script>
const rawData = document.getElementById("chart-data").textContent;
const chartData = JSON.parse(rawData);

/* PIE CHART */
new Chart(document.getElementById("pieChart"), {
type: "pie",
data: {
labels: chartData.moods,
datasets: [{
data: chartData.counts,
backgroundColor: ["#4ade80","#facc15","#f87171"]
}]
},
options: {
responsive: true,
maintainAspectRatio: false,
plugins: {
legend: { position: "bottom" }
}
}
});

/* LINE CHART */
new Chart(document.getElementById("lineChart"), {
type: "line",
data: {
labels: chartData.days,
datasets: [
{
label: "Happy",
data: chartData.trend_data.Happy,
borderColor: "#4ade80",
tension: 0.3
},
{
label: "Neutral",
data: chartData.trend_data.Neutral,
borderColor: "#facc15",
tension: 0.3
},
{
label: "Sad",
data: chartData.trend_data.Sad,
borderColor: "#f87171",
tension: 0.3
}
]
},
options: {
responsive: true,
maintainAspectRatio: false,
plugins: {
legend: { position: "bottom" }
},
scales: {
y: { beginAtZero: true }
}
}
});
</script>

</body>
</html>
