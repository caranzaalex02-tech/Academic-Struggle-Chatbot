<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mood Analytics</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
overflow:hidden;
color:white;
}

/* Background Video */
video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-1;
}

/* Overlay */
.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.65);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* Charts Container */
.charts{
width:95%;
max-width:900px;
display:flex;
justify-content:center;
align-items:center;
gap:15px;
}

/* Chart Box */
.chart-box{
width:45%;
height:230px;
background:white;
border-radius:10px;
padding:8px;
}

canvas{
width:100% !important;
height:100% !important;
}

/* Buttons */
.buttons{
margin-top:15px;
}

.buttons a{
display:inline-block;
margin:4px;
padding:6px 12px;
background:rgba(255,255,255,0.2);
color:white;
text-decoration:none;
border-radius:6px;
font-size:13px;
}

.buttons a:hover{
background:#ffcc00;
color:black;
}
</style>
</head>

<body>

<video autoplay muted loop>
<source src="{{ url_for('static', filename='videos/background.mp4') }}" type="video/mp4">
</video>

<div class="overlay">

<div class="charts">
<div class="chart-box">
<canvas id="pieChart"></canvas>
</div>

<div class="chart-box">
<canvas id="lineChart"></canvas>
</div>
</div>

<div class="buttons">
<a href="{{ url_for('chatbot') }}">⬅ Back</a>
<a href="{{ url_for('archived_room') }}">📂 Archive</a>
<a href="{{ url_for('logout') }}">🚪 Logout</a>
</div>

</div>

<!-- SAFE JSON DATA (NO RED IN JS) -->
<script id="chart-data" type="application/json">
{
  "moods": {{ moods | tojson }},
  "counts": {{ counts | tojson }},
  "days": {{ days | tojson }},
  "trend_data": {{ trend_data | tojson }}
}
</script>

<script>
const rawData = document.getElementById("chart-data").textContent;
const chartData = JSON.parse(rawData);

/* PIE CHART */
new Chart(document.getElementById("pieChart"), {
type: "pie",
data: {
labels: chartData.moods,
datasets: [{
data: chartData.counts,
backgroundColor: ["#4caf50","#ffeb3b","#f44336"]
}]
},
options: {
responsive: true,
maintainAspectRatio: false,
plugins: {
legend: { position: "bottom" }
}
}
});

/* LINE CHART */
new Chart(document.getElementById("lineChart"), {
type: "line",
data: {
labels: chartData.days,
datasets: [
{
label: "Happy",
data: chartData.trend_data.Happy,
borderColor: "#4caf50",
tension: 0.3
},
{
label: "Neutral",
data: chartData.trend_data.Neutral,
borderColor: "#ffeb3b",
tension: 0.3
},
{
label: "Sad",
data: chartData.trend_data.Sad,
borderColor: "#f44336",
tension: 0.3
}
]
},
options: {
responsive: true,
maintainAspectRatio: false,
plugins: {
legend: { position: "bottom" }
},
scales: {
y: { beginAtZero: true }
}
}
});
</script>

</body>
</html>
