<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Group Study - Peer Support</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">

<style>

/* ============================================================
   SIDEBAR â€” premium professional, modern SaaS style
   ============================================================ */
.sidebar{
position:fixed;
top:0;
left:0;
bottom:0;
width:272px;
/* Gold fluid wavy abstract background â€” gold_fluid_waves_bg.svg */
background:#fefdf0 url('{{ url_for('static', filename='images/gold_fluid_waves_bg.svg') }}') center/cover no-repeat;
color:#6d5a12;
display:flex;
flex-direction:column;
z-index:50;
box-shadow:4px 0 24px rgba(80,53,10,0.35), 1px 0 0 rgba(255,255,255,0.18);
border-right:1px solid rgba(120,80,15,0.25);
overflow-y:auto;
overflow-x:hidden;
}

/* ---- SANC.AI logo wordmark (replaces ESSU logo at top of sidebar) ---- */
.sidebar-brand{
padding:18px 14px 8px;
text-align:center;
line-height:1.2;
}
.sidebar-brand .brand-name{
font-family:'Poppins','Inter','Segoe UI',sans-serif;
font-size:1.55rem;
font-weight:700;
letter-spacing:0.045em;
color:#6d5a12;
text-shadow:0 1px 0 rgba(255,255,255,0.5);
}
.sidebar-brand .brand-ai{
margin-left:2px;
padding:1px 7px 2px;
border-radius:7px;
font-size:0.58em;
letter-spacing:0.06em;
vertical-align:0.28em;
color:#fff8e7;
background:linear-gradient(135deg,#f59e0b,#b45309);
box-shadow:0 3px 8px rgba(180,83,9,0.45), inset 0 1px 0 rgba(255,255,255,0.45);
}
.sidebar-brand .brand-wave{
display:block;
width:118px;
height:12px;
margin:5px auto 0;
}

/* ---- User profile card at top ---- */
.sidebar-user{
display:flex;
align-items:center;
gap:12px;
padding:24px 20px 20px;
border-bottom:1px solid rgba(120,80,15,0.18);
margin:0 4px 20px;
}
.sidebar-avatar{
flex-shrink:0;
width:44px;
height:44px;
border-radius:14px;
background:linear-gradient(135deg,#f59e0b,#d97706);
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
color:#fffbea;
box-shadow:0 8px 20px rgba(217,119,6,0.45);
position:relative;
}
.sidebar-avatar::after{
content:'';
position:absolute;
bottom:-2px;
right:-2px;
width:12px;
height:12px;
border-radius:50%;
background:#16a34a;
border:2px solid #fde68a;
}
.sidebar-user-info{
min-width:0;
}
.sidebar-user-name{
font-size:0.88rem;
font-weight:700;
color:#7c6a12;
letter-spacing:-0.01em;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.sidebar-user-email{
font-size:0.68rem;
color:#9a8a1c;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-top:1px;
}

/* ---- Section labels ---- */
.sidebar-section-label{
padding:0 20px;
margin:18px 0 8px;
font-size:0.65rem;
font-weight:700;
text-transform:uppercase;
letter-spacing:0.08em;
color:#a5901e;
}

/* ---- Navigation nav ---- */
.sidebar nav{
flex:1;
padding:0 12px;
display:flex;
flex-direction:column;
}

.sidebar a{
display:flex;
align-items:center;
gap:12px;
color:#8a6d1a;
text-decoration:none;
padding:10px 14px;
border-radius:10px;
margin-bottom:2px;
transition:all 0.2s cubic-bezier(0.4,0,0.2,1);
font-weight:600;
font-size:0.85rem;
position:relative;
letter-spacing:0.01em;
}
.sidebar a i{
width:20px;
text-align:center;
font-size:16px;
transition:color 0.2s ease, transform 0.2s ease;
}
.sidebar a:hover{
background:rgba(255,255,255,0.55);
color:#5a4a0c;
box-shadow:inset 0 0 0 1px rgba(217,119,6,0.25);
}
.sidebar a:hover i{
color:#b45309;
transform:translateX(2px);
}
.sidebar a.active{
background:linear-gradient(135deg,rgba(245,158,11,0.35),rgba(253,230,138,0.55));
color:#5a4a0c;
box-shadow:inset 0 0 0 1px rgba(180,83,9,0.45);
}
.sidebar a.active i{
color:#92400e;
}

/* ---- Sidebar footer ---- */
.sidebar-footer{
padding:12px 16px 20px;
border-top:1px solid rgba(120,80,15,0.2);
margin:12px 12px 0;
}
.sidebar-footer a{
display:flex;
align-items:center;
gap:10px;
color:#7c2d12;
text-decoration:none;
padding:8px 10px;
border-radius:8px;
font-size:0.82rem;
font-weight:600;
transition:all 0.2s ease;
}
.sidebar-footer a:hover{
background:rgba(255,255,255,0.55);
color:#b91c1c;
}
.sidebar-footer a:hover i{
color:#dc2626;
}
.sidebar-footer a i{
font-size:15px;
transition:color 0.2s ease;
}

/* ---- Sidebar separator divider ---- */
.sidebar-divider{
height:1px;
background:rgba(120,80,15,0.22);
margin:8px 16px;
}
.sidebar-page{margin-left:272px;flex:1;min-height:100vh;min-width:0;display:flex;justify-content:center;align-items:flex-start;}
@media (max-width: 768px){
/* ---- sidebar â€“ collapse to top bar ---- */
  .sidebar {
    width: 100%;
    height: 56px;
    min-height: 56px;
    max-height: 56px;
    position: fixed;
    top: 0;
    left: 0;
    bottom: auto;
    flex-direction: row;
    align-items: center;
    padding: 6px 8px;
    z-index: 55;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    background:#fefdf0 url('{{ url_for('static', filename='images/gold_fluid_waves_bg.svg') }}') center/cover no-repeat;
    box-shadow:0 4px 16px rgba(80,53,10,0.2);
  }
  .sidebar-user { display: none; }
  .sidebar-divider { display: none; }
  /* Compact SANC.AI logo sa mobile top bar */
  .sidebar-brand { padding: 4px 8px; }
  .sidebar-brand .brand-name { font-size: 1rem; }
  .sidebar-brand .brand-wave { width: 74px; height: 8px; margin-top: 3px; }
  .sidebar nav {
    display: flex;
    flex-direction: row;
    gap: 3px;
    flex: 1;
  }
  .sidebar a {
    padding: 6px 10px;
    font-size: 0.7rem;
    white-space: nowrap;
    margin-bottom: 0;
    border-radius: 8px;
  }
  .sidebar a i {
    font-size:14px;
    width:16px;
  }
  .sidebar a:hover { transform: none; }
  .sidebar a:hover i { transform: none; }
  .sidebar-footer {
    margin: 0;
    padding: 0 0 0 6px;
    border-top: none;
    border-left: 1px solid rgba(120,80,15,0.35);
  }
  .sidebar-footer a {
    padding:6px 8px;
    font-size:0.7rem;
  }
}
@media (max-width:768px){
  .sidebar-page{margin-left:0;width:100%;padding-top:calc(64px + env(safe-area-inset-top, 0px));}
  .sidebar-page > .container{margin-top:12px !important;}
}

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Poppins:wght@600;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
    min-height:100vh;
    /* Parehong background ng chatbot â€” light green fluid waves */
    background:#dcfce7 url('{{ url_for('static', filename='images/fluid_waves_bg.svg') }}') center/cover fixed no-repeat;
    color:#1a4a5a; font-family:'Segoe UI',sans-serif;
    padding:20px; position:relative; display:flex; justify-content:flex-start; align-items:stretch; padding:0;
}
body::after { content:""; position:fixed; inset:0; background:linear-gradient(160deg,rgba(220,252,231,.30),rgba(187,247,208,.22)); z-index:-1; pointer-events:none; }
.container {
    width:100%; max-width:640px; background:rgba(255,255,255,0.35); backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px); border-radius:20px; padding:28px 24px;
    box-shadow:0 8px 40px rgba(0,60,80,0.12),0 2px 8px rgba(0,40,60,0.06),inset 0 1px 0 rgba(255,255,255,0.4);
    border:1px solid rgba(255,255,255,0.5);
}
.back-btn { display:inline-flex; align-items:center; gap:6px; color:#4a7a8a; text-decoration:none; font-weight:600; font-size:0.9rem; transition:color 0.2s; margin-bottom:6px; }
.back-btn:hover { color:#0e6b7a; }
h1 { text-align:center; margin-bottom:6px; color:#1a4a5a; font-size:1.4rem; font-weight:700; }
.subtitle { text-align:center; color:#5a8a9a; font-size:0.8rem; margin-bottom:20px; }
.disclaimer-box { background:rgba(245,158,11,0.12); color:#0e6b7a; padding:10px 14px; border-radius:10px; font-size:12px; text-align:center; margin-bottom:20px; border:1px solid rgba(245,158,11,0.25); line-height:1.5; }
.search-container { margin-bottom:20px; }
.search-container input { width:100%; padding:12px 16px; border-radius:999px; border:1px solid rgba(255,255,255,0.5); font-size:0.9rem; background:rgba(255,255,255,0.45); backdrop-filter:blur(6px); color:#1a4a5a; outline:none; transition:border-color 0.15s,box-shadow 0.15s,background 0.15s; }
.search-container input::placeholder { color:#7aacbc; }
.search-container input:focus { border-color:#0ea5b9; background:rgba(255,255,255,0.65); box-shadow:0 0 0 4px rgba(14,165,185,0.12); }
.user-list { display:flex; flex-direction:column; gap:8px; }
.user-card { background:rgba(255,255,255,0.45); backdrop-filter:blur(8px); padding:14px 16px; border-radius:14px; display:flex; justify-content:space-between; align-items:center; transition:0.2s ease; border:1px solid rgba(255,255,255,0.4); }
.profile-pic {
        width:44px; height:44px; min-width:44px; min-height:44px; max-width:44px; max-height:44px;
        border-radius:14px; object-fit:cover; flex-shrink:0;
        border:2px solid rgba(255,255,255,0.5); box-shadow:0 4px 12px rgba(0,40,60,0.1);
    }
    .large-pic {
        width:48px !important; height:48px !important;
        min-width:48px; min-height:48px; max-width:48px; max-height:48px;
    }
    .current-user-profile { background:rgba(255,255,255,0.45); backdrop-filter:blur(10px); padding:18px; border-radius:16px; display:flex; align-items:center; gap:14px; margin-bottom:24px; border:1px solid rgba(255,255,255,0.5); }
.current-user-info h3 { font-size:1rem; color:#1a4a5a; margin-bottom:2px; }
.current-user-info p { font-size:0.75rem; color:#5a8a9a; }
.change-pic-btn { background:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.45); color:#1a4a5a; padding:6px 12px; border-radius:999px; cursor:pointer; font-size:11px; font-weight:600; margin-top:6px; transition:background 0.15s,border-color 0.15s,color 0.15s; }
.change-pic-btn:hover { background:rgba(14,165,185,0.15); border-color:rgba(14,165,185,0.4); color:#0e6b7a; }
.modal { display:none; position:fixed; z-index:100; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,40,60,0.5); backdrop-filter:blur(6px); }
.modal-content { background:rgba(255,255,255,0.9); backdrop-filter:blur(20px); margin:15% auto; padding:28px 24px; border:1px solid rgba(255,255,255,0.5); width:90%; max-width:400px; border-radius:16px; text-align:center; color:#1a4a5a; box-shadow:0 12px 40px rgba(0,60,80,0.2); position:relative; animation:slideDown 0.35s cubic-bezier(0.22,1,0.36,1); }
@keyframes slideDown { from { opacity:0; transform:translateY(-24px); } to { opacity:1; transform:translateY(0); } }
.close-modal { position:absolute; top:14px; right:16px; width:30px; height:30px; border-radius:50%; border:1px solid rgba(14,165,185,0.2); background:rgba(255,255,255,0.6); color:#5a8a9a; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; transition:background 0.15s,color 0.15s; }
.close-modal:hover { background:rgba(14,165,185,0.15); color:#0e6b7a; }
.info-text { color:#5a8a9a; font-size:13px; margin-bottom:16px; }
#pfp-upload-input { margin:12px 0; font-size:13px; color:#1a4a5a; }
#upload-btn { background:linear-gradient(135deg,#0ea5b9,#0891b2); color:#fff; border:none; padding:10px 20px; border-radius:999px; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(14,165,185,0.3); }
#upload-btn:hover { box-shadow:0 6px 18px rgba(14,165,185,0.4); }
#upload-status { margin-top:10px; font-size:13px; font-weight:600; }
.no-users { text-align:center; color:#5a8a9a; font-size:0.9rem; padding:20px; }
.user-info { display:flex; align-items:center; gap:12px; min-width:0; flex:1; }
.user-meta { min-width:0; }
.username { font-weight:700; color:#1a4a5a; font-size:0.9rem; word-break:break-word; }
.user-sub { color:#5a8a9a; font-size:0.75rem; word-break:break-all; }
.badge { background:#0ea5b9; color:#fff; font-size:10px; padding:2px 7px; border-radius:999px; margin-left:6px; font-weight:700; }
.chat-btn { background:linear-gradient(135deg,#0ea5b9,#0891b2); color:#fff; text-decoration:none; font-weight:700; font-size:0.8rem; padding:8px 14px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; box-shadow:0 4px 12px rgba(14,165,185,0.3); flex-shrink:0; white-space:nowrap; transition:box-shadow 0.15s, transform 0.15s; }
.chat-btn:hover { box-shadow:0 6px 18px rgba(14,165,185,0.4); transform:translateY(-1px); }
@media (max-width:768px){
    body{-webkit-text-size-adjust:100%;}
    .container{padding:20px 14px;}
    .search-container input{font-size:16px;}
}
/* ---- MOBILE: stable layout, walang galaw/jitter kapag nag-scroll ---- */
@media (max-width: 768px){
  html{
    height:100%;
    overscroll-behavior-y:none;
  }
  body{
    background-attachment:scroll !important;
    background-size:cover !important;
    min-height:100dvh;
    overflow-x:hidden;
    overscroll-behavior-y:none;
  }
  .sidebar{
    /* hindi nag-scroll nang mag-isa, kaya hindi gumagalaw ang top bar */
    overflow-x:hidden !important;
    overflow-y:hidden !important;
    overscroll-behavior:none;
    -webkit-overflow-scrolling:auto;
    touch-action:pan-x;
  }
  .sidebar nav{
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .sidebar nav::-webkit-scrollbar{display:none;}
  .sidebar-page{
    min-height:100dvh;
    padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    overscroll-behavior-y:contain;
    -webkit-overflow-scrolling:touch;
  }
  .container{
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
}
@media (max-width:480px){
    .container { padding:18px 14px; }
    .user-card { gap:10px; }
    .chat-btn { padding:8px 12px; font-size:0.75rem; }
    .profile-pic { width:38px; height:38px; min-width:38px; min-height:38px; max-width:38px; max-height:38px; }
    .current-user-profile { flex-wrap:wrap; }
}
</style>
</head>
<body>
<!-- SIDEBAR â€” same design as chatbot (SANC.AI) -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-name">SANC<span class="brand-ai">.AI</span></span>
    <svg class="brand-wave" viewBox="0 0 140 14" preserveAspectRatio="none" aria-hidden="true">
      <path d="M4 9 C30 2 52 13 78 7 C100 2 120 11 136 6" fill="none" stroke="#d97706" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M20 12.5 C44 7.5 62 14 88 10.5" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    </svg>
  </div>
  <div class="sidebar-user">
    <div class="sidebar-avatar">
      <i class="fas fa-user-graduate"></i>
    </div>
    <div class="sidebar-user-info">
      <div class="sidebar-user-name">{{ session.get('display_name', session.get('user', 'Student')) }}</div>
      <div class="sidebar-user-email">Online</div>
    </div>
  </div>
  <nav>
    {% if session.get('role') == 'admin' %}
    <a href="/admin_dashboard"><i class="fas fa-shield-alt"></i> Admin Dashboard</a>

    {% endif %}
    <a href="{{ url_for('chatbot') }}" ><i class="fas fa-comments"></i> Chatbot</a>
    <a href="{{ url_for('community') }}" class="active"><i class="fas fa-users"></i> Group Study</a>
    <a href="{{ url_for('user_settings') }}" ><i class="fas fa-sliders-h"></i> Settings</a>
    <a href="{{ url_for('archived_room') }}" ><i class="fas fa-box-archive"></i> Archived</a>
  </nav>
  <div class="sidebar-footer">
    <a href="/logout"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
  </div>
</aside>

<div class="sidebar-page"><div class="container">
    <a href="/chatbot" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Chatbot</a>
    <h1>Group Study</h1>
    <p class="subtitle">Connect with fellow students. You are not alone.</p>
    <div class="rooms-section">
        <button class="toggle-rooms-btn" onclick="toggleRooms()"
