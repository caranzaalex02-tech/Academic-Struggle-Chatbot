<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            perspective: 1200px; /* Add perspective for 3D effect */
            font-family: 'Poppins', sans-serif;
        }
        .auth-box {
            width: 90%;
            max-width: 400px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,255,255,0.2);
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: #ccc;
            margin-bottom: 5px;
            display: block;
        }
        .auth-box h2 { margin-bottom: 20px; font-weight: 600; }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin: 0; /* Tinanggal ang margin para sa form-group */
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            transition: background-color 0.3s;
        }
        .password-wrapper input {
            padding-right: 58px;
        }
        .auth-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .auth-box input:focus {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            top: 64%;
            right: 14px;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.95);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            user-select: none;
        }
        .toggle-password:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.28);
            transform: translateY(-50%) scale(1.05);
        }
        .toggle-password:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.28);
            color: #00c6ff;
            transform: translateY(-50%) scale(1.05);
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #00c6ff;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        .auth-box button:hover { background: #0072ff; }
        .error { color: #ff6b6b; margin-bottom: 10px; font-size: 14px; }
        .switch { margin-top: 15px; font-size: 14px; }
        .switch a { color: #00c6ff; text-decoration: none; font-weight: 500; }

        /* New Transition Styles */
        .auth-box h2, .auth-box .error, .auth-box form, .auth-box .switch {
            opacity: 0;
            animation: fadeInUp 0.5s ease-out 0.4s forwards; /* Delay this animation */
        }
        .auth-box {
            animation: rotateIn 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transition: transform 0.6s cubic-bezier(0.6, -0.28, 0.735, 0.045), opacity 0.6s;
        }
        .auth-box.is-flipping-out {
            transform: rotateY(90deg) scale(0.9);
            opacity: 0;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* New keyframes for the box rotation */
        @keyframes rotateIn {
            from {
                transform: rotateY(-90deg) scale(0.9);
                opacity: 0;
            }
            to {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div class="auth-box">
    <h2>Academic Struggle Support Chatbot</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" autocomplete="off">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group password-wrapper">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter your password" required>
            <span class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5m0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5Z"/></svg>
                <svg id="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M12 7c2.76 0 5 2.24 5 5c0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75C21.27 7.61 17 4.5 12 4.5c-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7M2.28 4.49L.86 5.91 2 7.05C1.29 7.95.72 9 1 10.24c.73 3.38 3.97 6.03 7 6.71v-1.7c-1.73-.43-3.23-1.55-4.26-3.01.3-.5.66-1 1.06-1.47l1.42 1.42c-.15.43-.28.88-.36 1.34h1.5c.08-.44.21-.86.39-1.26l2.11 2.11c-.4.1-.81.15-1.23.15-2.76 0-5-2.24-5-5c0-.59.11-1.16.31-1.69L2.28 4.49M12 17c.95 0 1.82-.27 2.57-.72l1.43 1.43C15.9 18.44 14.62 19 13.19 19v1.7c3.03-.68 6.27-3.33 7-6.71.28-1.24-.29-2.29-1-3.19L17.73 8.57 12 14.3 2.28 4.49Z"/></svg>
            </span>
        </div>
        <button type="submit">Sign In</button>
    </form>

    <p class="switch">
        Don't have an account? <a id="go-to-register" href="{{ url_for('register') }}">Create Account</a>
    </p>
    <p class="switch" style="margin-top: 5px; font-size: 12px;">
        <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
    </p>
    <!-- Admin login link is hidden for regular users -->
</div>

<script>
    // New script for flip transition
    const authBox = document.querySelector('.auth-box');
    const registerLink = document.getElementById('go-to-register');
    const adminLink = document.getElementById('go-to-admin');

    registerLink.addEventListener('click', function(event) {
        event.preventDefault(); // Stop the link from navigating immediately
        authBox.classList.add('is-flipping-out'); // Add class to trigger animation

        // Wait for the animation to finish before navigating
        setTimeout(() => {
            window.location.href = this.href;
        }, 600); // Match the CSS transition duration
    });

    if (adminLink) {
        adminLink.addEventListener('click', function(event) {
            event.preventDefault();
            authBox.classList.add('is-flipping-out');
            setTimeout(() => {
                window.location.href = this.href;
            }, 600);
        });
    }

    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeOpen.style.display = isPassword ? 'none' : 'inline';
        eyeClosed.style.display = isPassword ? 'inline' : 'none';
    }
</script>

</body>
</html>
