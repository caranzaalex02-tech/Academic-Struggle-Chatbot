<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.55" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#86efac" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="waveC" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#86efac" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <!-- Green base gradient -->
  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- Abstract fluid blobs (blurred, green-dominant) -->
  <g filter="url(#soft)">
    <path d="M-160,120 C180,-80 470,190 380,430 C290,670 -50,580 -160,360 Z" fill="#4ade80" opacity="0.8"/>
    <path d="M-100,520 C120,430 320,600 250,760 C180,920 -60,860 -120,700 Z" fill="#86efac" opacity="0.7"/>
    <path d="M1180,-100 C1430,-30 1540,230 1370,360 C1210,480 1040,300 1090,130 Z" fill="#fde68a" opacity="0.5"/>
    <circle cx="760" cy="830" r="300" fill="#4ade80" opacity="0.55"/>
    <circle cx="1300" cy="700" r="220" fill="#86efac" opacity="0.6"/>
  </g>

  <!-- Fluid waves: green ang pangunahing kulay, yellow as accent -->
  <path d="M0,85 C300,165 520,15 820,80 C1120,145 1260,40 1440,90 L1440,0 L0,0 Z" fill="url(#waveB)" opacity="0.55"/>
  <path d="M0,530 C220,455 360,640 620,585 C880,530 1020,660 1440,550 L1440,900 L0,900 Z" fill="url(#waveC)"/>
  <path d="M0,650 C260,565 420,745 700,680 C980,615 1180,760 1440,655 L1440,900 L0,900 Z" fill="url(#waveB)" opacity="0.65"/>
  <path d="M0,745 C240,690 480,840 760,775 C1040,710 1240,850 1440,770 L1440,900 L0,900 Z" fill="url(#waveA)"/>
  <path d="M0,845 C300,805 560,890 860,840 C1120,798 1300,875 1440,840 L1440,900 L0,900 Z" fill="#22c55e" opacity="0.45"/>
</svg>
